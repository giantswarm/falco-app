{{- if and .Values.kyvernoPolicyExceptions.enabled .Values.kyvernoPolicyExceptions.cel.enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ include "falco-helpers.fullname" . }}-falco-exceptions
  namespace: {{ .Values.kyvernoPolicyExceptions.namespace | default (include "falco-helpers.namespace" .) }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  policyRefs:
  - name: restrict-volume-types
    kind: ValidatingPolicy
  - name: disallow-privilege-escalation
    kind: ValidatingPolicy
  - name: require-run-as-nonroot
    kind: ValidatingPolicy
  - name: disallow-host-path
    kind: ValidatingPolicy
  - name: restrict-seccomp-strict
    kind: ValidatingPolicy
  - name: disallow-privileged-containers
    kind: ValidatingPolicy
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  # require-container-requests-and-limits is a supplemental policy and usually
  # not enabled. It is excepted because the falco DaemonSet fails it when the
  # policy is enforced.
  - name: require-container-requests-and-limits
    kind: ValidatingPolicy
  # require-pod-probes is a supplemental policy and usually not enabled. It is
  # excepted because the falco DaemonSet fails it when the policy is enforced.
  - name: require-pod-probes
    kind: ValidatingPolicy
  # require-ro-rootfs is a supplemental policy and usually not enabled. It is
  # excepted because the falco DaemonSet fails it when the policy is enforced.
  - name: require-ro-rootfs
    kind: ValidatingPolicy
  # restrict-sa-automount-sa-token is a supplemental policy and usually not
  # enabled. It is excepted because the falco ServiceAccount fails it when the
  # policy is enforced.
  - name: restrict-sa-automount-sa-token
    kind: ValidatingPolicy
  matchConditions:
  - name: falco-workloads
    # ServiceAccount is matched for restrict-sa-automount-sa-token.
    expression: >-
      request.kind.kind in ['DaemonSet', 'Pod', 'ServiceAccount'] &&
      request.namespace == '{{ include "falco-helpers.namespace" . }}' &&
      has(object.metadata.name) &&
      object.metadata.name.startsWith('{{ include "falco-helpers.fullname" . }}')
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ include "falco-helpers.fullname" . }}-falcosidekick-exceptions
  namespace: {{ .Values.kyvernoPolicyExceptions.namespace | default (include "falco-helpers.namespace" .) }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  policyRefs:
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  - name: disallow-privilege-escalation
    kind: ValidatingPolicy
  - name: require-run-as-nonroot
    kind: ValidatingPolicy
  - name: restrict-seccomp-strict
    kind: ValidatingPolicy
  # require-container-requests-and-limits is a supplemental policy and usually
  # not enabled. It is excepted because the falcosidekick Deployments and the
  # falcosidekick-ui redis StatefulSet fail it when the policy is enforced.
  - name: require-container-requests-and-limits
    kind: ValidatingPolicy
  # require-ro-rootfs is a supplemental policy and usually not enabled. It is
  # excepted because the falcosidekick Deployments and the falcosidekick-ui
  # redis StatefulSet fail it when the policy is enforced.
  - name: require-ro-rootfs
    kind: ValidatingPolicy
  # restrict-sa-automount-sa-token is a supplemental policy and usually not
  # enabled. It is excepted because the falcosidekick ServiceAccounts fail it
  # when the policy is enforced.
  - name: restrict-sa-automount-sa-token
    kind: ValidatingPolicy
  matchConditions:
  - name: falcosidekick-workloads
    # ServiceAccount is matched for restrict-sa-automount-sa-token.
    expression: >-
      request.kind.kind in ['Deployment', 'ReplicaSet', 'Pod', 'StatefulSet', 'ServiceAccount'] &&
      request.namespace == '{{ include "falco-helpers.namespace" . }}' &&
      has(object.metadata.name) &&
      object.metadata.name.startsWith('{{ include "falco-helpers.fullname" . }}-falcosidekick')
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ include "falco-helpers.fullname" . }}-k8s-metacollector-exceptions
  namespace: {{ .Values.kyvernoPolicyExceptions.namespace | default (include "falco-helpers.namespace" .) }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
spec:
  policyRefs:
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  - name: disallow-privilege-escalation
    kind: ValidatingPolicy
  - name: restrict-seccomp-strict
    kind: ValidatingPolicy
  # require-container-requests-and-limits is a supplemental policy and usually
  # not enabled. It is excepted because the k8s-metacollector Deployment fails
  # it when the policy is enforced.
  - name: require-container-requests-and-limits
    kind: ValidatingPolicy
  # require-ro-rootfs is a supplemental policy and usually not enabled. It is
  # excepted because the k8s-metacollector Deployment fails it when the policy
  # is enforced.
  - name: require-ro-rootfs
    kind: ValidatingPolicy
  # restrict-sa-automount-sa-token is a supplemental policy and usually not
  # enabled. It is excepted because the k8s-metacollector ServiceAccount fails
  # it when the policy is enforced.
  - name: restrict-sa-automount-sa-token
    kind: ValidatingPolicy
  matchConditions:
  - name: k8s-metacollector-workloads
    # ServiceAccount is matched for restrict-sa-automount-sa-token.
    expression: >-
      request.kind.kind in ['Deployment', 'ReplicaSet', 'Pod', 'ServiceAccount'] &&
      request.namespace == '{{ include "falco-helpers.namespace" . }}' &&
      has(object.metadata.name) &&
      object.metadata.name.startsWith('{{ include "falco-helpers.fullname" . }}-k8s-metacollector')
{{- end -}}
