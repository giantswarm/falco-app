ciliumNetworkPolicy:
  enabled: true

global:
  podSecurityStandards:
    enforced: true

verticalPodAutoscaler:
  enabled: false

kyvernoPolicyExceptions:
  enabled: true
  namespace: giantswarm

falco:
  image:
    registry: gsoci.azurecr.io
    repository: giantswarm/falco
  collectors:
    kubernetes:
      enabled: true
  driver:
    kind: modern_ebpf
    loader:
      initContainer:
        image:
          registry: gsoci.azurecr.io
          repository: giantswarm/falco-driver-loader
  customRules:
    gs-root-ca-key-access.yaml: |-
      - list: root_ca_key_path
        items:
        - "/etc/kubernetes/pki/ca.key"
      - rule: File Related Operation on Root CA Key Path
        desc: Detect any file operation on the path to root CA key
        condition: (fs.path.name pmatch (root_ca_key_path) or fs.path.source pmatch (root_ca_key_path) or fs.path.target pmatch (root_ca_key_path))
        output: "Root CA key file '%fs.path.name' was accessed via operation '%evt.type' (source path '%fs.path.source', target path '%fs.path.target') triggered by the user '%user.name' running '%proc.cmdline' (from '%proc.pcmdline') in container '%container.name' (ID=%container.id) built from image '%container.image.repository'. Additional details (if available):"
        priority: WARNING
        source: syscall
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
  controller:
    daemonset:
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 10%
    labels:
      application.giantswarm.io/team: "shield"

  # Ships Falco pod logs to the observability platform's default security tenant.
  # Falco pod metrics are operational and still sent to the default tenant, as they are not security events.
  podLabels:
    observability.giantswarm.io/tenant: giantswarm_security_default

  falco:
    # Emit alerts as structured JSON so the events are queryable in Loki.
    json_output: true

  metrics:
    enabled: true
    outputRule: true
  webserver:
    enabled: true
    prometheus_metrics_enabled: true
  serviceMonitor:
    create: true
    labels:
      application.giantswarm.io/team: "shield"

  serviceAccount:
    # We set the service account name only so that we can use it for attaching a PSP.
    name: "falco"
  falcoctl:
    image:
      registry: gsoci.azurecr.io
      repository: giantswarm/falcoctl
  tty: true
  # Makes Falco forward events to Falcosidekick. Keep in sync with the `falcosidekick.enabled`.
  falcosidekick:
    enabled: true
  k8s-metacollector:
    fullnameOverride: ""
    service:
      ports:
        broker-grpc:
          port: 45000

falcosidekick:
  # If enabled, Falco must also be configured to forward events here. Keep in sync with `falco.falcosidekick.enabled`.
  enabled: true
  image:
    registry: gsoci.azurecr.io
    repository: giantswarm/falcosidekick
  serviceMonitor:
    enabled: true
    additionalLabels:
      application.giantswarm.io/team: "shield"

k8s-metacollector:
  enabled: true
  image:
    registry: gsoci.azurecr.io
    repository: giantswarm/k8s-metacollector
  serviceMonitor:
    create: true
    interval: 60s
    labels:
      application.giantswarm.io/team: "shield"
