ciliumNetworkPolicy:
  enabled: true

global:
  podSecurityStandards:
    enforced: true

verticalPodAutoscaler:
  enabled: false

kyvernoPolicyExceptions:
  enabled: true
  namespace: giantswarm

serviceMonitors:
  # Falco and Falcosidekick each serve operational metrics and security metrics on one endpoint.
  # Two ServiceMonitors per endpoint split the series between two observability tenants,
  # so that security data stays apart from operations data.

  # -- Observability tenant for the operational metrics: every series that the component's `securityMetrics` do not match.
  operationsTenant: giantswarm
  # -- Observability tenant for the security metrics. The tenant must exist, otherwise the platform drops the series.
  securityTenant: giantswarm_security_default
  falco:
    # -- Create the two ServiceMonitors for the Falco metrics endpoint. Needs `falco.metrics.enabled`, and `falco.serviceMonitor.create` must stay `false`.
    enabled: true
    # -- Scrape interval of both ServiceMonitors.
    interval: 15s
    # -- Scrape timeout of both ServiceMonitors.
    scrapeTimeout: 10s
    # -- Falco metric names (or regular expressions matching the whole name) that are security data. They go to `securityTenant` only, every other series goes to `operationsTenant` only. With an empty list everything goes to `operationsTenant`.
    securityMetrics:
      - falcosecurity_falco_rules_matches_total
  falcosidekick:
    # -- Create the two ServiceMonitors for the Falcosidekick metrics endpoint. `falcosidekick.serviceMonitor.enabled` must stay `false`.
    enabled: true
    # -- Scrape interval of both ServiceMonitors. Empty uses the platform default.
    interval: ""
    # -- Scrape timeout of both ServiceMonitors. Empty uses the platform default.
    scrapeTimeout: ""
    # -- Falcosidekick metric names (or regular expressions matching the whole name) that are security data, routed like `serviceMonitors.falco.securityMetrics`. The event counter names the namespace and pod of each Falco event.
    securityMetrics:
      - falcosecurity_falcosidekick_falco_events_total

falco:  # @schema skipProperties: true; additionalProperties: true
  # ephemeral-storage bounds the rules/plugins/state emptyDirs (require-emptydir-requests-and-limits); cpu/memory come from upstream.
  resources:
    requests:
      ephemeral-storage: 256Mi
    limits:
      ephemeral-storage: 1Gi
  image:
    registry: gsoci.azurecr.io
    repository: giantswarm/falco
  collectors:
    kubernetes:
      enabled: true
  driver:
    kind: modern_ebpf
    loader:
      initContainer:
        image:
          registry: gsoci.azurecr.io
          repository: giantswarm/falco-driver-loader
  customRules:
    gs-root-ca-key-access.yaml: |-
      - list: root_ca_key_path
        items:
        - "/etc/kubernetes/pki/ca.key"
      - rule: File Related Operation on Root CA Key Path
        desc: Detect any file operation on the path to root CA key
        condition: (fs.path.name pmatch (root_ca_key_path) or fs.path.source pmatch (root_ca_key_path) or fs.path.target pmatch (root_ca_key_path))
        output: "Root CA key file '%fs.path.name' was accessed via operation '%evt.type' (source path '%fs.path.source', target path '%fs.path.target') triggered by the user '%user.name' running '%proc.cmdline' (from '%proc.pcmdline') in container '%container.name' (ID=%container.id) built from image '%container.image.repository'. Additional details (if available):"
        priority: WARNING
        source: syscall
  tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
    # Giant Swarm arm64 node pools carry this taint. Without it the DaemonSet skips arm64 nodes,
    # so they get no runtime detection. The falco and falcoctl images are multi-arch.
    - effect: NoSchedule
      key: kubernetes.io/arch
      operator: Equal
      value: arm64
  controller:
    daemonset:
      updateStrategy:
        rollingUpdate:
          maxUnavailable: 10%
    labels:
      application.giantswarm.io/team: "shield"

  # Ships Falco pod logs to the observability platform's default security tenant.
  # Falco pod metrics are operational and still sent to the default tenant, as they are not security events.
  podLabels:
    observability.giantswarm.io/tenant: giantswarm_security_default

  falco:
    # Emit alerts as structured JSON so the events are queryable in Loki.
    json_output: true

  metrics:
    enabled: true
    outputRule: true
  webserver:
    enabled: true
    prometheus_metrics_enabled: true
  # The upstream ServiceMonitor feeds one tenant with every series, so it would send the security
  # metrics to the operations tenant. The chart renders its own pair instead, see `serviceMonitors.falco`.
  serviceMonitor:
    create: false

  serviceAccount:
    # We set the service account name only so that we can use it for attaching a PSP.
    name: "falco"
  falcoctl:
    image:
      registry: gsoci.azurecr.io
      repository: giantswarm/falcoctl
    artifact:
      install:
        resources:
          requests:
            ephemeral-storage: 64Mi
          limits:
            ephemeral-storage: 512Mi
      follow:
        resources:
          requests:
            ephemeral-storage: 64Mi
          limits:
            ephemeral-storage: 512Mi
  tty: true
  # Makes Falco forward events to Falcosidekick. Keep in sync with the `falcosidekick.enabled`.
  falcosidekick:
    enabled: true
  k8s-metacollector:
    fullnameOverride: ""
    service:
      ports:
        broker-grpc:
          port: 45000

falcosidekick:  # @schema skipProperties: true; additionalProperties: true
  # If enabled, Falco must also be configured to forward events here. Keep in sync with `falco.falcosidekick.enabled`.
  enabled: true
  image:
    registry: gsoci.azurecr.io
    repository: giantswarm/falcosidekick
  # As for Falco: the chart renders its own pair of ServiceMonitors, see `serviceMonitors.falcosidekick`.
  serviceMonitor:
    enabled: false
  # Lets falcosidekick run on Giant Swarm arm64 node pools, which carry this taint. All its images
  # (falcosidekick, falcosidekick-ui, redis-stack-server, curl) are multi-arch.
  tolerations:
    - effect: NoSchedule
      key: kubernetes.io/arch
      operator: Equal
      value: arm64
  webui:
    tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: arm64
    redis:
      tolerations:
        - effect: NoSchedule
          key: kubernetes.io/arch
          operator: Equal
          value: arm64
  testConnection:
    tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: arm64

k8s-metacollector:  # @schema skipProperties: true; additionalProperties: true
  enabled: true
  image:
    registry: gsoci.azurecr.io
    repository: giantswarm/k8s-metacollector
  serviceMonitor:
    create: true
    interval: 60s
    labels:
      application.giantswarm.io/team: "shield"
      observability.giantswarm.io/tenant: giantswarm
  # Lets k8s-metacollector run on Giant Swarm arm64 node pools, which carry this taint. Its image is multi-arch.
  tolerations:
    - effect: NoSchedule
      key: kubernetes.io/arch
      operator: Equal
      value: arm64
